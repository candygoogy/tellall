<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tellall spike: C2PA in a worker</title>
  </head>
  <body>
    <h1>C2PA in a worker</h1>
    <input type="file" id="file" accept="image/*" />
    <pre id="out"></pre>
    <p><a href="paste-probe.html">Paste probe</a></p>
    <script type="module">
      const out = document.getElementById("out");
      const worker = new Worker(new URL("./c2pa-worker.ts", import.meta.url), { type: "module" });
      worker.onmessage = (e) => { out.textContent = e.data; };
      worker.onerror = (e) => { out.textContent = "worker error: " + e.message; };
      document.getElementById("file").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        out.textContent = "reading " + file.name + "...";
        const bytes = new Uint8Array(await file.arrayBuffer());
        worker.postMessage(bytes, [bytes.buffer]);
      });
    </script>
  </body>
</html>
